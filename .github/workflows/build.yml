name: Build Android Launcher APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Detect web project, build, and prepare Capacitor webDir
        run: |
          set -e
          mkdir -p www_dist

          if [ -f "package.json" ]; then
            npm ci || npm install
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              npm run build
            fi
          fi

          SOURCE_DIR=""
          for candidate in dist build out www public; do
            if [ -f "$candidate/index.html" ]; then
              SOURCE_DIR="$candidate"
              break
            fi
          done

          if [ -z "$SOURCE_DIR" ]; then
            FOUND_INDEX=$(find . -maxdepth 4 -name "index.html" \
              -not -path "./node_modules/*" \
              -not -path "./android/*" \
              -not -path "./www_dist/*" \
              -not -path "./.git/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              SOURCE_DIR=$(dirname "$FOUND_INDEX")
            fi
          fi

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/index.html" ]; then
            echo "Error: Could not locate index.html in project."
            exit 1
          fi

          echo "Using web source directory: $SOURCE_DIR"
          if [ "$SOURCE_DIR" = "." ]; then
            rsync -a \
              --exclude='node_modules' \
              --exclude='android' \
              --exclude='www_dist' \
              --exclude='.git' \
              --exclude='.github' \
              ./ www_dist/
          else
            cp -a "$SOURCE_DIR/." www_dist/
          fi

          if [ ! -f "www_dist/index.html" ]; then
            echo "Error: www_dist/index.html missing after copy."
            exit 1
          fi

      - name: Initialize Capacitor and add Android platform
        run: |
          set -e
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.cardeck.launcher",
            "appName": "CarDeck",
            "webDir": "www_dist",
            "bundledWebRuntime": false
          }
          EOF

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure AndroidManifest.xml as Home Launcher
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          application = root.find("application")
          if application is not None:
              for activity in application.findall("activity"):
                  for intent_filter in activity.findall("intent-filter"):
                      actions = [a.get(f"{ns}name") for a in intent_filter.findall("action")]
                      if "android.intent.action.MAIN" in actions:
                          existing = [c.get(f"{ns}name") for c in intent_filter.findall("category")]
                          for required in ("android.intent.category.HOME", "android.intent.category.DEFAULT"):
                              if required not in existing:
                                  cat = ET.SubElement(intent_filter, "category")
                                  cat.set(f"{ns}name", required)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
