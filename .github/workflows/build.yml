name: Build CarPlay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & Package Android APK
        run: |
          PKG_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -n "$PKG_FILE" ]; then
            PKG_DIR=$(dirname "$PKG_FILE")
            echo "Found package.json in: $PKG_DIR"
            cd "$PKG_DIR"
            npm install --legacy-peer-deps
            npm run build
            
            WEB_DIR="dist"
            if [ -d "build" ]; then WEB_DIR="build"; fi
            if [ ! -d "$WEB_DIR" ]; then WEB_DIR="."; fi
          else
            HTML_FILE=$(find . -name "index.html" | head -n 1)
            PKG_DIR=$(dirname "$HTML_FILE")
            echo "Found index.html in: $PKG_DIR"
            cd "$PKG_DIR"
            npm init -y
            mkdir -p www
            cp -r * www/ 2>/dev/null || true
            WEB_DIR="www"
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "CarDeck" "com.cardeck.launcher" --web-dir="$WEB_DIR"
          npx cap add android
          
          # إضافة صلاحية اللانشر الرئيسي لشاشة السيارة تلقائياً
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/>\n                <category android:name="android.intent.category.HOME" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>/g' "$MANIFEST"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output_apk/CarDeck.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarDeck-APK
          path: output_apk/CarDeck.apk
